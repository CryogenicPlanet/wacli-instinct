name: Release wacli-instinct

on:
  push:
    tags: ["v*-instinct.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1 CGO_CFLAGS=-Wno-error=missing-braces
          go test ./internal/instinct ./cmd/wacli-instinct
          mkdir -p package
          go build -tags sqlite_fts5 -trimpath -ldflags='-s -w' -o package/wacli ./cmd/wacli
          go build -tags sqlite_fts5 -trimpath -ldflags='-s -w' -o package/wacli-instinct ./cmd/wacli-instinct
          cp LICENSE README.md package/
          mkdir -p package/deploy
          cp -R docs package/docs
          cp -R deploy/instinct package/deploy/instinct
          tar -czf "wacli-instinct-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C package .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: wacli-instinct-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.2.1
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          gh release create "${GITHUB_REF_NAME}" *.tar.gz checksums.txt --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "wacli-instinct fork release. Includes wacli and the read-only Instinct bridge. See docs/instinct.md for deployment and reliability limits."
