name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI Environment
        uses: ./.github/actions/setup-ci-env
        with:
          setup-node: "true"
          node-version: "26"
          setup-pnpm: "true"
          apt-packages: "build-essential"

      - name: pnpm format:check
        run: pnpm format:check

      - name: pnpm lint
        run: pnpm lint

      - name: Verify exact Go build toolchain
        run: test "$(go env GOVERSION)" = "go1.27.1"

      - name: govulncheck source
        run: pnpm govulncheck:source

      - name: pnpm lint:deadcode
        run: pnpm lint:deadcode

      - name: pnpm test
        env:
          CGO_ENABLED: "1"
        run: pnpm test

      - name: pnpm build
        env:
          CGO_ENABLED: "1"
        run: pnpm build

      - name: Build Instinct bridge
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-Wno-error=missing-braces"
        run: go build -tags sqlite_fts5 ./cmd/wacli-instinct

      - name: pnpm docs:site
        run: pnpm docs:site
